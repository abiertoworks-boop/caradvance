# main ブランチに push すると、お名前.com のサーバーへ FTP(S) で自動アップロードします。
# 事前に GitHub の Settings → Secrets and variables → Actions に以下を登録してください。
#   FTP_SERVER      例）sv12345.onamae.ne.jp など（お名前.com のサーバー情報に記載のFTPホスト）
#   FTP_USERNAME    FTPユーザー名
#   FTP_PASSWORD    FTPパスワード
#   FTP_SERVER_DIR  アップロード先フォルダ（末尾は / ）例）/public_html/  ※未登録なら ./public_html/
# Secrets が未登録の間は、このワークフローは何もせずに終了します。
name: Deploy to Onamae

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-onamae
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTP secrets are not set yet. Skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Upload via FTPS
        if: steps.check.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_SERVER_DIR || './public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
